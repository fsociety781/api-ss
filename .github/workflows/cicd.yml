name: ShroomSync Backend CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: shroomsync-backend-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/fsociety781/shroomsync-api

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/shroomsync_test?schema=public"
          JWT_SECRET: "shroomsync-test-secret-at-least-32-chars-long!"
          NODE_ENV: test

      - name: Build TypeScript
        run: npm run build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main

  deploy-production:
    needs: test-build-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy API to VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || '20159' }}
          envs: DEPLOY_IMAGE,GHCR_TOKEN,GHCR_USER
          command_timeout: 5m
          script: |
            set -eu

            cd /opt/shroomsync/api-ss

            # Login ke GHCR jika token tersedia
            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin 2>/dev/null || true
            fi

            # Simpan image lama untuk rollback
            OLD_IMAGE="$(docker inspect shroomsync_api --format '{{.Config.Image}}' 2>/dev/null || echo 'none')"

            echo "📦 Pull image baru: $DEPLOY_IMAGE"
            docker pull "$DEPLOY_IMAGE"

            echo "🚀 Deploy API dengan image baru..."
            SHROOMSYNC_API_IMAGE="$DEPLOY_IMAGE" docker compose up -d --no-deps api

            echo "⏳ Menunggu health check (max 60 detik)..."
            HEALTHY=0
            for i in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 3 \
                http://127.0.0.1:3000/api/health > /dev/null 2>&1; then
                HEALTHY=1
                break
              fi
              sleep 2
            done

            if [ "$HEALTHY" -eq 1 ]; then
              echo "✅ Deploy berhasil!"
              docker inspect shroomsync_api \
                --format 'Image={{.Config.Image}} Status={{.State.Status}}'
              docker image prune -f --filter "until=24h" || true
              exit 0
            fi

            echo "❌ Health check gagal! Log container:"
            docker logs --tail 100 shroomsync_api 2>&1 || true
            echo ""
            echo "📊 Status container:"
            docker inspect shroomsync_api \
              --format 'Status={{.State.Status}} ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}}' \
              2>/dev/null || true

            if [ "$OLD_IMAGE" != "none" ] && [ "$OLD_IMAGE" != "$DEPLOY_IMAGE" ]; then
              echo "🔄 Rollback ke image sebelumnya: $OLD_IMAGE"
              SHROOMSYNC_API_IMAGE="$OLD_IMAGE" docker compose up -d --no-deps api

              for i in $(seq 1 15); do
                if curl --fail --silent --show-error --max-time 3 \
                  http://127.0.0.1:3000/api/health > /dev/null 2>&1; then
                  echo "✅ Rollback berhasil."
                  exit 1
                fi
                sleep 2
              done
            fi

            echo "⚠️ PERINGATAN: API belum pulih setelah rollback."
            docker logs --tail 100 shroomsync_api 2>&1 || true
            exit 1

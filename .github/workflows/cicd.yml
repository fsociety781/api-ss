name: ShroomSync Backend CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: shroomsync-backend-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/fsociety781/shroomsync-api

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/shroomsync_test?schema=public"
          JWT_SECRET: "shroomsync-test-secret-at-least-32-chars-long!"
          NODE_ENV: test

      - name: Build TypeScript
        run: npm run build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main

  deploy-production:
    needs: test-build-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy API to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '20159' }}
          command_timeout: 10m
          script: |
            set -eu

            cd /opt/shroomsync/api-ss

            echo "📥 Mengambil commit terbaru dari GitHub..."
            git pull origin main

            echo "🔨 Membangun kontainer API..."
            docker compose build api

            echo "🚀 Memperbarui kontainer shroomsync_api..."
            docker compose up -d --no-deps api

            echo "⏳ Menunggu health check API (max 60 detik)..."
            HEALTHY=0
            for i in $(seq 1 30); do
              if curl --fail --silent --max-time 3 http://127.0.0.1:3000/api/health > /dev/null 2>&1; then
                HEALTHY=1
                break
              fi
              sleep 2
            done

            if [ "$HEALTHY" -eq 1 ]; then
              echo "✅ Deploy berhasil dan API berstatus Healthy!"
              docker compose ps api
              exit 0
            fi

            echo "❌ Health check gagal! Log kontainer:"
            docker logs --tail 80 shroomsync_api
            exit 1
